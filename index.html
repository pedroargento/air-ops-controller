<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Air Operations Controller</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        grid-template-columns: minmax(0, 1fr) 420px;
        background: #14181a;
        color: #dfe4e0;
        font: 13px/1.4 system-ui, sans-serif;
      }
      button {
        background: #2a3236; color: inherit; border: 1px solid #47525a;
        border-radius: 3px; padding: 3px 8px; font: inherit; cursor: pointer;
      }
      button:hover { background: #38434a; }
      button.active { background: #2f6f4f; border-color: #55b083; }
      h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 6px; color: #9fb0a8; }
      h3 { font-size: 12px; margin: 8px 0 4px; }
      p { margin: 2px 0; }
      #controls {
        grid-column: 1 / 3; display: flex; gap: 6px; align-items: center;
        padding: 6px 10px; background: #1b2124; border-bottom: 1px solid #333c41;
      }
      #clock { font: 600 18px monospace; margin: 0 10px; }
      #status { font-weight: 600; color: #ffd24a; }
      #objective { margin-left: auto; color: #9fb0a8; }
      #map-holder { position: relative; overflow: hidden; }
      #map-holder.picking canvas { cursor: crosshair; }
      #map { display: block; }
      #tooltip {
        display: none; position: absolute; pointer-events: none; white-space: pre;
        background: rgba(0, 0, 0, 0.85); padding: 5px 8px; border-radius: 3px; font: 12px monospace;
      }
      #cursor-grid {
        display: none; position: absolute; right: 12px; bottom: 12px; pointer-events: none;
        background: rgba(0, 0, 0, 0.7); padding: 4px 8px; border-radius: 3px; font: 13px monospace; color: #fff;
      }
      #legend {
        position: absolute; left: 12px; top: 44px; z-index: 30; width: min(860px, calc(100% - 40px)); max-height: calc(100% - 70px);
        overflow-y: auto; padding: 8px 12px; background: rgba(18, 24, 27, 0.97); border: 1px solid #3a464b; border-radius: 4px;
        color: #e6ece8; font: 12px sans-serif;
      }
      #legend h2 { margin: 0; font-size: 14px; }
      #legend h3 { margin: 10px 0 4px; font-size: 12px; color: #9fb0a8; }
      .legend-head { display: flex; justify-content: space-between; align-items: center; }
      .legend-columns { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 18px; }
      .legend-row { display: flex; align-items: center; gap: 8px; margin: 2px 0; }
      .legend-sample { flex: none; border-radius: 2px; }
      .legend-term { flex: none; width: 128px; font-family: monospace; color: #ffd24a; }
      #legend[hidden] { display: none; }
      #mission-report { width: min(980px, 90vw); max-height: 86vh; overflow: auto; background: #1b2124; color: #e4e9e6; border: 1px solid #71877a; padding: 24px; line-height: 1.5; }
      #mission-report::backdrop { background: rgba(0, 0, 0, .72); }
      .report-head { display: flex; justify-content: space-between; align-items: start; gap: 16px; }
      .report-head h1 { margin: 0; }
      #mission-report h2 { font-size: 18px; color: #c3d6c8; }
      #mission-report section { padding: 12px 0; border-bottom: 1px solid #46524a; }
      #mission-report footer { padding-top: 16px; }
      .report-table { overflow-x: auto; }
      #mission-report table { width: 100%; border-collapse: collapse; font-size: 13px; }
      #mission-report td, #mission-report th { text-align: left; padding: 8px; border-bottom: 1px solid #46524a; }
      #mission-report caption { text-align: left; color: #9fb0a8; }
      .aircraft-report { border: 1px solid #46524a; margin: 10px 0; padding: 12px; }
      #mission-report summary { cursor: pointer; }
      .report-metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
      .report-metrics dt { color: #9fb0a8; font-size: 12px; }
      .report-metrics dd { margin: 0; font-size: 18px; }
      #tracks { overflow-y: auto; flex: 1; font-size: 11px; min-height: 0; }
      #tracks table { width: 100%; border-collapse: collapse; }
      #tracks td, #tracks th { padding: 2px 4px; text-align: left; border-bottom: 1px solid #2a3236; }
      #tracks tr.track-row { cursor: pointer; }
      #tracks tr.track-row:hover { background: #20282b; }
      #tracks tr.active { background: #24323a; }
      #tracks tr.stale td { color: #8a9499; }
      #tracks tr.destroyed td { color: #6a7277; text-decoration: line-through; }
      #tracks .aa { color: #ff3df0; font-weight: bold; }
      #mission-time { font: 12px monospace; color: #cfd8d3; margin-right: 10px; }
      #light { font: 12px sans-serif; margin-right: 10px; padding: 2px 6px; border-radius: 3px; }
      #light.night { background: #1a2340; color: #c8d4ff; }
      #light.twilight { background: #3a3550; color: #e8dcff; }
      #light.day { color: #9fb0a8; }
      .hint-quiet { color: #9fb0a8; }
      #side-tabs { margin: 0 0 6px; }
      #side-tabs .active { outline: 1px solid #9fb0a8; }
      #path-profile { position: absolute; left: 12px; right: 12px; bottom: 48px; width: calc(100% - 24px); height: 70px; pointer-events: none; }
      #map-toasts {
        position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: min(460px, calc(100% - 220px));
        display: flex; flex-direction: column; gap: 6px; pointer-events: none;
      }
      .toast {
        pointer-events: auto; text-align: left; font-size: 13px; line-height: 1.3; color: #eef3f0; padding: 7px 10px;
        background: rgba(18, 24, 27, 0.92); border: 1px solid #3a464b; border-left: 4px solid #9fb0a8; border-radius: 4px; cursor: pointer;
      }
      .danger { color: #ff6b5a; font-size: 11px; }
      .fire-line { color: #ffb3a8; margin: 2px 0; }
      .request-card { border: 1px solid #333c41; border-left: 3px solid #57636a; border-radius: 3px; padding: 5px 7px; margin: 5px 0; font-size: 12px; }
      .request-card.open { border-left-color: #ff6b5a; background: rgba(255, 107, 90, 0.07); }
      .request-card .buttons { margin-top: 4px; }
      .request-status { margin-top: 4px; color: #9fd3a8; font-size: 11px; }
      .danger-row { margin-top: 3px; }
      button.primary { background: #2b5f8a; border-color: #4a8fd8; color: #fff; }
      #scenario-menu { position: fixed; inset: 0; z-index: 100; overflow-y: auto; background: #12181c; padding: 32px 16px; }
      #scenario-menu[hidden] { display: none; }
      body:not(.playing) > header, body:not(.playing) > main, body:not(.playing) > aside { display: none; }
      .menu-box { max-width: 760px; margin: 0 auto; }
      .menu-box h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: 0.04em; }
      .scenario-list { list-style: none; margin: 16px 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
      .scenario-card { width: 100%; text-align: left; display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; background: #1c252b; border: 1px solid #3a4850; border-radius: 4px; color: inherit; font: inherit; cursor: pointer; }
      .scenario-card:hover, .scenario-card:focus-visible { border-color: #4a8fd8; background: #213039; }
      .scenario-card.last { border-left: 4px solid #4a8fd8; }
      a.scenario-card.resume { box-sizing: border-box; margin: 10px 0 14px; text-decoration: none; border-color: #4a8fd8; }
      .scenario-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 15px; }
      .scenario-objective { color: #e6d27a; }
      .scenario-summary { color: #c9d3d8; line-height: 1.4; }
      .scenario-facts { color: #8a979e; font-size: 12px; }
      .light-tag { font-size: 12px; padding: 1px 6px; border-radius: 3px; white-space: nowrap; }
      .light-tag.day { background: #4a4420; color: #ffe27a; }
      .light-tag.twilight { background: #3a2f45; color: #d6b8ff; }
      .light-tag.night { background: #1c2340; color: #9fb3ff; }
      .seed input { background: #1a2024; color: inherit; border: 1px solid #57636a; padding: 3px 6px; }
      .log-row.outgoing { border-left: 3px solid #4a8fd8; background: rgba(74, 143, 216, 0.08); }
      .toast.sent { background: rgba(30, 60, 95, 0.92); border-color: #4a8fd8; }
      .toast.urgent { border-left-color: #ff6b5a; background: rgba(60, 22, 20, 0.94); }
      #map-menu {
        position: absolute; z-index: 5; min-width: 190px; padding: 8px; display: flex; flex-direction: column; gap: 5px;
        background: rgba(18, 24, 27, 0.96); border: 1px solid #3a464b; border-radius: 4px; font-size: 12px;
      }
      #map-menu[hidden] { display: none; }
      #map-menu hr { border: none; border-top: 1px solid #3a464b; margin: 4px 0; width: 100%; }
      #map-banner { position: absolute; left: 50%; bottom: 46px; transform: translateX(-50%); z-index: 6; padding: 6px 12px;
        background: rgba(43, 95, 138, 0.95); border: 1px solid #4a8fd8; border-radius: 4px; color: #fff; font-size: 13px; pointer-events: none; }
      #map-banner[hidden] { display: none; }
      #pickup { position: absolute; right: 12px; top: 60px; z-index: 20; width: 300px; padding: 8px 10px; background: rgba(40, 18, 14, 0.96);
        border: 2px solid #ff6b5a; border-radius: 4px; font-size: 12px; display: flex; flex-direction: column; gap: 8px; }
      #pickup[hidden] { display: none; }
      .pickup-row { display: flex; flex-direction: column; gap: 4px; }
      .pickup-bar { height: 10px; background: #1a2024; border: 1px solid #57636a; }
      .pickup-bar span { display: block; height: 100%; background: #3fae5a; }
      #pickup button.lift { background: #8a2a20; border-color: #ff6b5a; color: #fff; font-weight: bold; font-size: 13px; padding: 6px 14px; }
      #timeline { position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 25; padding: 8px 10px; max-height: 42%;
        display: flex; flex-direction: column; gap: 6px; background: rgba(18, 24, 27, 0.96); border: 1px solid #4a8fd8; border-radius: 4px; font-size: 12px; }
      #timeline[hidden] { display: none; }
      #timeline-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      #timeline-head .review-time { font: 600 16px monospace; color: #ffd24a; }
      #timeline-track { position: relative; height: 26px; }
      #timeline-slider { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; margin: 0; }
      #timeline-marks { position: absolute; left: 0; right: 0; top: 0; height: 10px; }
      #timeline-marks span { position: absolute; top: 0; width: 3px; height: 10px; margin-left: -1px; background: #9fb0a8; }
      #timeline-marks span.urgent { background: #ff6b5a; }
      #timeline-events { overflow-y: auto; min-height: 0; }
      #timeline-events button { display: block; width: 100%; text-align: left; margin: 1px 0; font-size: 11px; }
      #timeline-events button.urgent { border-left: 3px solid #ff6b5a; }
      .task-now { font-weight: bold; color: #ffd24a; margin: 2px 0 4px; }
      .task-fields { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 6px; padding: 5px; border: 1px dashed #4a8fd8; border-radius: 3px; }
      .setting-row { display: grid; grid-template-columns: 64px 1fr; align-items: center; gap: 6px; margin-top: 4px; }
      .setting-row .buttons { margin-top: 0; }
      #selection h3 { margin: 8px 0 2px; font-size: 12px; color: #9fb0a8; }
      #map-menu h3 { margin: 0; font-size: 12px; color: #9fb0a8; }
      .menu-recipients { display: flex; flex-direction: column; gap: 2px; }
      .menu-fire { display: flex; align-items: center; gap: 4px; }
      #map-menu input[type=number] { width: 48px; }
      #map-layers { position: absolute; left: 12px; top: 10px; margin: 0; }
      #map-layers .active { outline: 1px solid #fff; }
      #forecast {
        position: absolute; left: 172px; top: 10px; display: flex; align-items: center; gap: 6px;
        background: rgba(0, 0, 0, 0.7); padding: 3px 8px; border-radius: 3px; font: 12px monospace; color: #fff;
      }
      #forecast[hidden] { display: none; }
      #forecast { flex-wrap: wrap; max-width: calc(100% - 240px); }
      #forecast-key { flex-basis: 100%; font-size: 11px; color: #cfd8d3; }
      #forecast-lead { width: 180px; }
      #sidebar { display: grid; grid-template-rows: auto auto auto auto minmax(0, 1fr); min-height: 0; border-left: 1px solid #333c41; }
      #sidebar > section { padding: 8px 10px; border-bottom: 1px solid #333c41; }
      #altitude-profile { display: block; width: 100%; height: 130px; cursor: ns-resize; }
      #aircraft { max-height: 142px; overflow-y: auto; margin-top: 4px; }
      .aircraft-row {
        display: grid; grid-template-columns: 72px 78px minmax(0, 1fr) 54px 34px 40px; gap: 4px;
        width: 100%; text-align: left; font-size: 11px; padding: 2px 4px; margin-bottom: 2px;
      }
      #unit-list { display: flex; flex-wrap: wrap; gap: 4px; }
      .unit-chip { display: inline-flex; gap: 6px; align-items: baseline; padding: 2px 8px; font-size: 12px; }
      .unit-chip.active { border-color: #4a8fd8; background: #213039; }
      .unit-chip .age { color: #8a979e; }
      .unit-chip .age.unknown { color: #ff9a5a; }
      .aircraft-row > * { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      .buttons { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
      .hint { color: #ffd24a; }
      .preview { margin: 6px 0; padding: 6px; background: #20282b; font-style: italic; }
      .recipient { display: block; }
      .history { margin: 6px 0 0; padding-left: 16px; font-size: 12px; }
      #radio { display: flex; flex-direction: column; min-height: 0; }
      #net-status { font-size: 11px; color: #9aa7ad; padding: 2px 0 4px; min-height: 14px; }
      #net-status .busy { color: #ffd24a; }
      /* The bottom tabs always keep room: the panels above scroll instead of crowding them out. */
      #selection { max-height: 38vh; overflow-y: auto; }
      #requests { max-height: 26vh; overflow-y: auto; }
      #units { max-height: 14vh; overflow-y: auto; padding-top: 4px; padding-bottom: 6px; }
      #units h2 { margin-bottom: 4px; }
      #radio { min-height: 160px; }
      #radio-log { overflow-y: auto; flex: 1; min-height: 0; }
      .log-row { padding: 4px 0; border-bottom: 1px solid #2a3236; font-size: 12px; }
      .log-row .time { font-family: monospace; color: #9fb0a8; }
      .log-row .kind { font-size: 10px; color: #9fb0a8; }
      #radio-log.main-only .log-row.routine { display: none; }
      .log-row.urgent { border-left: 3px solid #ff6b5a; padding-left: 5px; }
      .log-row.routine { opacity: 0.65; }
      .radio-filter { margin-left: auto; display: inline-flex; gap: 4px; }
      .log-row.tic { background: rgba(255, 210, 74, 0.12); }
      .log-row.support_request { background: rgba(255, 107, 90, 0.12); }
      .coord { padding: 0 4px; font: 11px monospace; color: #8fd0ff; }
    </style>
  </head>
  <body>
    <div id="scenario-menu" hidden></div>
    <header id="controls"></header>
    <main id="map-holder">
      <canvas id="map"></canvas>
      <div id="tooltip"></div>
      <div id="cursor-grid"></div>
      <div id="map-layers" class="buttons"></div>
      <div id="map-toasts"></div>
      <div id="map-menu" hidden></div>
      <div id="map-banner" hidden></div>
      <div id="pickup" hidden></div>
      <div id="timeline" hidden>
        <div id="timeline-head"></div>
        <div id="timeline-track"><div id="timeline-marks"></div><input id="timeline-slider" type="range" min="0" max="0" step="30" value="0" /></div>
        <div id="timeline-events"></div>
      </div>
      <div id="forecast" hidden>
        <input id="forecast-lead" type="range" min="0" max="4500" step="300" value="0" />
        <span id="forecast-label"></span>
        <button data-action="forecast-eta">Aircraft ETA</button>
        <button data-action="forecast-now">Now</button>
        <span id="forecast-key">
          <b style="color: #ff4a3d">■</b> base under <span id="forecast-altitude"></span>
          <b style="color: #ffd24a">■</b> +250 <b style="color: #6fb7ff">■</b> +500 · ⟋ rain, denser = heavier · dashed = likely path, +15 = minutes from now
        </span>
      </div>
      <canvas id="path-profile" height="70" hidden></canvas>
      <div id="legend" hidden></div>
    </main>
    <aside id="sidebar">
      <section id="fleet">
        <h2>Aircraft</h2>
        <canvas id="altitude-profile" height="130"></canvas>
        <div id="aircraft"></div>
      </section>
      <section id="units"><h2>Units on the net</h2><div id="unit-list"></div></section>
      <section id="requests"></section>
      <section id="selection"></section>
      <section id="radio">
        <div id="side-tabs" class="buttons"></div>
        <div id="net-status"></div>
        <div id="tracks" hidden></div>
        <div id="radio-log"></div>
      </section>
    </aside>
    <dialog id="mission-report" aria-labelledby="mission-report-title"></dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
